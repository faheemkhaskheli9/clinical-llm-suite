[project]
name = "clinical-llm-suite"
version = "0.1.0"
description = "Clinical LLM Suite: patient-intake assistant, human review portal, and summarization/extraction pipeline behind one feature picker"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "Django==5.2.6",
    "requests>=2.31.0",
    "urllib3>=1.26",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django==4.11.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "clinical_suite.settings"
pythonpath = ["src"]
testpaths = ["tests"]
